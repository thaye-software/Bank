# ── Required: fill these in from your SonarQube account ──────────────────────
# Project key: SonarQube > Your Project > Project Information > Project Key
sonar.projectKey=thaye-software_Bank
# Organization key: SonarQube > My Account > Organizations (Cloud only)
sonar.organization=thaye-software

# ── Project metadata ──────────────────────────────────────────────────────────
sonar.projectName=NordicBank

# ── Source layout ─────────────────────────────────────────────────────────────
sonar.sources=src
sonar.tests=tests
# Mark test files inside src/ so SonarQube doesn't report smells/bugs on them
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts
# Exclude generated Prisma client and build output
sonar.exclusions=**/node_modules/**,**/dist/**,**/src/generated/**,**/client/**

# ── Coverage ──────────────────────────────────────────────────────────────────
# SonarQube accepts a comma-separated list of LCOV files. We combine four
# sources so the Sonar report reflects every test layer:
#   • coverage/unit/lcov.info             — Vitest unit tests
#   • coverage/integration/lcov.info      — Vitest DB integration tests
#   • coverage/playwright-api/lcov.info   — Playwright api-integration project
#                                            (server runs in-process under
#                                             NODE_V8_COVERAGE, post-processed
#                                             by c8 report)
#   • coverage/playwright-e2e/lcov.info   — E2E browser tests against an
#                                            externally-running server that
#                                            was started with NODE_V8_COVERAGE
sonar.javascript.lcov.reportPaths=coverage/unit/lcov.info,coverage/integration/lcov.info,coverage/playwright-api/lcov.info,coverage/playwright-e2e/lcov.info

# ── TypeScript ────────────────────────────────────────────────────────────────
sonar.typescript.tsconfigPath=tsconfig.json


#test pipeline