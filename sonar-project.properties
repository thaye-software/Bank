# ── Required: fill these in from your SonarQube account ──────────────────────
# Project key: SonarQube > Your Project > Project Information > Project Key
sonar.projectKey=thaye-software_Bank
# Organization key: SonarQube > My Account > Organizations (Cloud only)
sonar.organization=thaye-software

# ── Project metadata ──────────────────────────────────────────────────────────
sonar.projectName=NordicBank

# ── Source layout ─────────────────────────────────────────────────────────────
sonar.sources=src
sonar.tests=tests
# Mark test files inside src/ so SonarQube doesn't report smells/bugs on them
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts
# Exclude generated Prisma client and build output
sonar.exclusions=**/node_modules/**,**/dist/**,**/src/generated/**,**/client/**

# ── Coverage ──────────────────────────────────────────────────────────────────
# SonarQube accepts a comma-separated list of LCOV files. We combine three
# sources so the Sonar report reflects every test layer that contributes
# meaningful coverage:
#   • coverage/unit/lcov.info             — Vitest unit tests
#   • coverage/integration/lcov.info      — Vitest DB integration tests
#   • coverage/playwright-api/lcov.info   — Playwright api-integration project
#                                            (server runs in-process under
#                                             NODE_V8_COVERAGE, post-processed
#                                             by c8 report)
#
# E2E browser tests are intentionally NOT included — they exercise the same
# backend code paths as api-integration tests (both go through the full
# Express middleware/controller stack), so collecting separate coverage for
# them would be redundant and adds CI complexity (instrumented server start,
# SIGTERM-based shutdown, etc.). E2E tests still run in CI as a pass/fail
# gate; they just don't contribute to the coverage report.
sonar.javascript.lcov.reportPaths=coverage/unit/lcov.info,coverage/integration/lcov.info,coverage/playwright-api/lcov.info

# ── TypeScript ────────────────────────────────────────────────────────────────
sonar.typescript.tsconfigPath=tsconfig.json


