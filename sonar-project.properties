# ── Required: fill these in from your SonarQube account ──────────────────────
# Project key: SonarQube > Your Project > Project Information > Project Key
sonar.projectKey=thaye-software_Bank
# Organization key: SonarQube > My Account > Organizations (Cloud only)
sonar.organization=thaye-software

# ── Project metadata ──────────────────────────────────────────────────────────
sonar.projectName=NordicBank

# ── Source layout ─────────────────────────────────────────────────────────────
sonar.sources=src
sonar.tests=tests
# Mark test files inside src/ so SonarQube doesn't report smells/bugs on them
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts
# Exclude generated Prisma client and build output
sonar.exclusions=**/node_modules/**,**/dist/**,**/src/generated/**,**/client/**

# ── Coverage ──────────────────────────────────────────────────────────────────
# Path written by vitest --coverage (v8 provider, lcov reporter)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# ── TypeScript ────────────────────────────────────────────────────────────────
sonar.typescript.tsconfigPath=tsconfig.json


